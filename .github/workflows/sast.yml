name: sast

on: [push, pull_request]

permissions:
  contents: read
  security-events: write   # obligatoire pour l'upload SARIF

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep scan
        id: semgrep
        continue-on-error: true          # on laisse le step finir pour produire le SARIF
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.145.0 \
            semgrep scan --config=p/ci --config=.semgrep/ \
              --sarif --output=semgrep.sarif --error --metrics=off \
              lib routes models

      - name: Upload SARIF vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep